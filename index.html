<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-creator="Derek and Timothy">Tree game</title>
    <style>
        :root {
            --theme-green: #324A22;
            --theme-background: #92c4a6;
            --theme-red: #ff0000;
        }

        body {
            background-color: var(--theme-background);

            height: 100vh;
            width: 100vw;
        }

        .text {
            color: black;
        }

        .text-title {
            font-size: 40pt;
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: var(--theme-green);
            text-shadow: 0 0 6px #ffffffaa;
        }
        
        .text-subtitle {
            font-size: 20pt;
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: var(--theme-green);
        }

        .grid {
            margin-left: 50%;
            transform: translate(-50%, 0);
            width: 300px;
            height: 300px;
        }

        .grid-item {
            position: relative;
        }

        .grid-square {
            border: 2px solid black;
        }

        .grid-square-white {
            background-color: #ffffff;
        }

        .grid-square-green {
            background-color: var(--theme-green);
        }

        .grid-square-red {
            background-color: var(--theme-red);
        }

        .grid-number {
            text-align: center;
            line-height: 50px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20pt;
            border: none;
        }

        .grid-corner {
            border: none;
        }
    </style>
</head>

<body>
    <h1 class="text text-title">Tree Game</h1>
    <h1 class="text text-subtitle">By LycheeDragonFruit8 and Derek</h1>
    <table class="grid">
        <tbody id="grid">
            <!--Javascript-->
        </tbody>
    </table>
    <h1 class="text text-subtitle">Copyright &copy; 2025</h1>
    <script>
        function updateGrid(elem, size, numbers, grid=[]) {
    let html = "";
    html += "<tr id='grid-row-top' class='grid-row'>";
    html += "<td class='grid-corner grid-item'></td>";
    for (let x = 0; x < size; x++) {
        html += `<td class='grid-number grid-item'>${numbers[0][x]?numbers[0][x]:0}</td>`;
    }
    html += "<td class='grid-corner grid-item'></td></tr>";
    for (let y = 0; y < size; y++) {
        html += `<tr id='grid-row-${y}' class='grid-row'>`;
        html += `<td class='grid-number grid-item'>${numbers[3][size - y - 1]?numbers[3][size - y - 1]:0}</td>`;
        for (let x = 0; x < size; x++) {
            let colour = grid[y][x] === 1 ? "grid-square-green"
                : grid[y][x] === 2 ? "grid-square-red" 
                : "grid-square-white";
            html += `<td id='grid-square-${y}-${x}' class='grid-square ${colour} grid-item' onclick="squareClick(${x},${y})"></td>`;
        }
        html += `<td class='grid-number grid-item'>${numbers[1][y]?numbers[1][y]:0}</td>`;
        html += "</tr>";
    }
    html += "<tr id='grid-row-bottom' class='grid-row'>";
    html += "<td class='grid-corner grid-item'></td>";
    for (let x = 0; x < size; x++) {
        html += `<td class='grid-number grid-item'>${numbers[2][size - x - 1]?numbers[2][size - x - 1]:0}</td>`;
    }
    html += "<td class='grid-corner grid-item'></td></tr>";
    elem.innerHTML = html;
}
        function getClearGrid(size) {
            var re = [];
            for (let y = 0; y < size; y++) {
                re.push([]);
                for (let x = 0; x < size; x++) {
                    re[y].push(0);
                }
            }
            return re;
        }
        const SIZE = 5;
        var grid = getClearGrid(SIZE);
        let elem = document.getElementById("grid");
        // Random numbers can be called by Math.floor(Math.random() * 6) to get a number between 0 and 5
        function getRandomSolutionGrid(size) {
    let grid = [];
    for (let y = 0; y < size; y++) {
        grid[y] = [];
        for (let x = 0; x < size; x++) {
            grid[y][x] = Math.floor(Math.random() * 3); // 0, 1, or 2
        }
    }
    return grid;
}

// 2. Calculate clues for each side based on the solution grid
function getCluesFromGrid(grid) {
    const size = grid.length;
    let top = [], right = [], bottom = [], left = [];
    // Top clues (columns, top to bottom)
    for (let x = 0; x < size; x++) {
        let count = 0;
        for (let y = 0; y < size; y++) {
            if (grid[y][x] === 1) count++; // Example: count green squares
        }
        top.push(count);
    }
    // Right clues (rows, left to right)
    for (let y = 0; y < size; y++) {
        let count = 0;
        for (let x = 0; x < size; x++) {
            if (grid[y][x] === 1) count++;
        }
        right.push(count);
    }
    // Bottom clues (columns, bottom to top)
    for (let x = 0; x < size; x++) {
        let count = 0;
        for (let y = size - 1; y >= 0; y--) {
            if (grid[y][x] === 1) count++;
        }
        bottom.push(count);
    }
    // Left clues (rows, right to left)
    for (let y = size - 1; y >= 0; y--) {
        let count = 0;
        for (let x = size - 1; x >= 0; x--) {
            if (grid[y][x] === 1) count++;
        }
        left.push(count);
    }
    return [top, right, bottom, left];
}

document.addEventListener("DOMContentLoaded", function() {
    const SIZE = 5;
    const solutionGrid = getRandomSolutionGrid(SIZE);
    const PUZZ = getCluesFromGrid(solutionGrid);
    var grid = getClearGrid(SIZE);
    let elem = document.getElementById("grid");
    updateGrid(elem, SIZE, PUZZ, grid);

    // Make grid and PUZZ accessible to squareClick
    window.grid = grid;
    window.PUZZ = PUZZ;
    window.SIZE = SIZE;
});
        function squareClick(x, y) {
            console.log("Clicked");
            grid[y][x] = (grid[y][x] + 1) % 3;
            let elem = document.getElementById("grid");
            updateGrid(elem, SIZE, PUZZ, grid);
        }
    </script>
</body>

</html>
