<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-creator="Derek and Timothy">Tree game</title>
    <style>
        :root {
            --theme-green: #324A22;
            --theme-darkgreen: #004723;
            --theme-background: #92c4a6;
            --theme-red: #ff0000;
        }

        body {
            background-color: var(--theme-background);

            height: 100vh;
            width: 100vw;
        }

        .text {
            color: black;
        }

        .text-title {
            font-size: 40pt;
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            color: var(--theme-darkgreen);
        }

        .grid {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
        }

        .grid-item {
            position: relative;
        }

        .grid-square {
            border: 2px solid black;
        }

        .grid-square-white {
            background-color: #ffffff;
        }

        .grid-square-green {
            background-color: var(--theme-green);
        }

        .grid-square-red {
            background-color: var(--theme-red);
        }

        .grid-number {
            text-align: center;
            line-height: 50px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20pt;
            border: none;
        }

        .grid-corner {
            border: none;
        }
    </style>
</head>

<body>
    <h1 class="text text-title">Tree Game</h1>
    <table class="grid">
        <tbody id="grid">
            <!--Javascript-->
        </tbody>
    </table>
    <script>
        function updateGrid(elem, size, numbers, grid=[]) {
            elem.innerHTML = ""; // Clear the grid
            elem.innerHTML += "<tr id='grid-row-top' class='grid-row'></tr>";
            document.getElementById("grid-row-top").innerHTML += "<td class='grid-corner grid-item'></td>";
            for (let x = 0; x < size; x++) {
                document.getElementById("grid-row-top").innerHTML += `<td class='grid-number grid-item'>${numbers[0][x]}</td>`;
            }
            document.getElementById("grid-row-top").innerHTML += "<td class='grid-corner grid-item'></td>";
            for (let y = 0; y < size; y++) {
                elem.innerHTML += `<tr id='grid-row-${y}' class='grid-row'></tr>`;
                document.getElementById("grid-row-" + y).innerHTML += `<td class='grid-number grid-item'>${numbers[3][size - y - 1]}</td>`;
                for (let x = 0; x < size; x++) {
                    let color = grid[y][x] === 1 ? "grid-square-green"
                        : grid[y][x] === 2 ? "grid-square-red" 
                        : "grid-square-white";
                    document.getElementById("grid-row-" + y).innerHTML += `<td id='grid-square-${y}-${x}' 
                        class='grid-square ${color} grid-item' onclick="squareClick(${x},${y})"></td>`;
                }
                document.getElementById("grid-row-" + y).innerHTML += `<td class='grid-number grid-item'>${numbers[1][y]}</td>`;
            }
            elem.innerHTML += "<tr id='grid-row-bottom' class='grid-row'></tr>";
            document.getElementById("grid-row-bottom").innerHTML += "<td class='grid-corner grid-item'></td>";
            for (let x = 0; x < size; x++) {
                document.getElementById("grid-row-bottom").innerHTML += `<td class='grid-number grid-item'>${numbers[2][size - x - 1]}</td>`;
            }
            document.getElementById("grid-row-bottom").innerHTML += "<td class='grid-corner grid-item'></td>";
        }
        function getClearGrid(size) {
            var re = [];
            for (let y = 0; y < size; y++) {
                re.push([]);
                for (let x = 0; x < size; x++) {
                    re[y].push(0);
                }
            }
            return re;
        }
        const SIZE = 5;
        var grid = getClearGrid(SIZE);
        let elem = document.getElementById("grid");
        // Random numbers can be called by Math.floor(Math.random() * 6) to get a number between 0 and 5
        const PUZZ = [[0, 0, 0, 3, 5], [2, 1, 2, 2, 1], [5, 3, 0, 0, 0], [1, 2, 2, 1, 2]]
        updateGrid(elem, SIZE, PUZZ, grid);
        function squareClick(x, y) {
            console.log("Clicked");
            grid[y][x] = (grid[y][x] + 1) % 3;
            let elem = document.getElementById("grid");
            updateGrid(elem, SIZE, PUZZ, grid);
        }
    </script>
</body>

</html>
